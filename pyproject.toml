[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datamil-pi0"
version = "0.1.0"
description = "DataMIL-style data selection for openpi pi0 in PyTorch"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.22.4,<2.0.0",
    "safetensors>=0.4.0",
    "torch>=2.7.1",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["datamil"]

[tool.hatch.build.targets.sdist]
include = [
    "/datamil",
    "/scripts",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 120
target-version = "py311"

